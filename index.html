<!DOCTYPE html>
<html lang="et" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bussid 8 & 8A | Oblika tee - Reaalaja väljumised</title>
  <meta name="description" content="Tallinna busside nr 8 ja 8A järgmised reaalajas väljumised Oblika tee peatusest.">

  <!-- Thematic Bus Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='10' y='40' width='10' height='22' rx='4' fill='%23020617'/%3E%3Crect x='44' y='40' width='10' height='22' rx='4' fill='%23020617'/%3E%3Crect x='8' y='3' width='48' height='49' rx='8' fill='%2300e0b3'/%3E%3Crect x='13' y='8' width='38' height='22' rx='5' fill='%23020617'/%3E%3Ccircle cx='18' cy='39' r='3.8' fill='%23ffffff'/%3E%3Ccircle cx='46' cy='39' r='3.8' fill='%23ffffff'/%3E%3Crect x='24' y='37' width='16' height='4' rx='2' fill='%23020617'/%3E%3C/svg%3E">
  <link rel="alternate icon" href="favicon.svg" type="image/svg+xml">

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            slate: {
              950: '#020617',
              900: '#0b1120',
              850: '#111b2e',
              800: '#1e293b',
            },
            tallinn: {
              green: '#4b8501',
              lightgreen: '#62ab02',
              darkgreen: '#376201',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Kohandatud taust ja klaas-efekt (Glassmorphism) */
    body {
      background-color: #020617;
      background-image: 
        radial-gradient(at 0% 0%, rgba(75, 133, 1, 0.18) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.14) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(30, 41, 59, 0.3) 0px, transparent 70%);
      background-attachment: fixed;
    }

    .glass-card {
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
    }

    .glass-subcard {
      background: rgba(30, 41, 59, 0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .fade-update {
      animation: flash-subtle 0.2s ease-out;
    }

    @keyframes flash-subtle {
      0% { opacity: 0.8; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body class="min-h-screen text-slate-100 flex flex-col justify-between antialiased selection:bg-emerald-500 selection:text-white p-4 sm:p-6 md:p-8">

  <!-- Peamine tsentreeritud konteiner -->
  <main class="w-full max-w-lg mx-auto flex-1 flex flex-col justify-center">

    <!-- Peakaart -->
    <div class="glass-card rounded-3xl p-6 sm:p-8 shadow-2xl relative overflow-hidden transition-all duration-300">
      

      <!-- Päis: Liini info & reaalaja staatus -->
      <header class="flex items-center justify-between gap-2.5 sm:gap-4 pb-4 sm:pb-5 border-b border-slate-800/80">
        <div class="flex items-center gap-2.5 sm:gap-3.5 min-w-0">
          <!-- Bussi numbrite märgid -->
          <div class="flex items-center -space-x-2 flex-shrink-0">
            <div class="w-11 h-11 sm:w-12 sm:h-12 rounded-xl sm:rounded-2xl bg-[#00e0b3] flex items-center justify-center shadow-lg shadow-[#00e0b3]/25 border border-white/30 ring-2 ring-slate-950 z-10">
              <span class="font-extrabold text-xl sm:text-2xl text-slate-950 tracking-tight">8</span>
            </div>
            <div class="w-11 h-11 sm:w-12 sm:h-12 rounded-xl sm:rounded-2xl bg-sky-500 flex items-center justify-center shadow-lg shadow-sky-500/25 border border-white/30 ring-2 ring-slate-950">
              <span class="font-extrabold text-lg sm:text-xl text-slate-950 tracking-tight">8A</span>
            </div>
          </div>
          <div class="min-w-0">
            <div class="flex items-center gap-2">
              <h1 class="text-lg sm:text-2xl font-bold tracking-tight text-white truncate">
                Oblika tee
              </h1>
            </div>
            <p id="route-subtitle" class="text-xs text-slate-400 font-medium tracking-wide flex items-center gap-1 mt-0.5 min-h-[1.25rem] whitespace-nowrap overflow-hidden">
              <span class="hidden sm:inline">Äigrumäe</span>
              <svg class="w-3 h-3 text-slate-500 inline flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
              <span id="route-destination" class="text-slate-300 font-semibold truncate">Väike-Õismäe / Viru keskus</span>
            </p>
          </div>
        </div>

        <!-- Reaalaja olekunupp / Live indikaator -->
        <div id="live-indicator" class="flex-shrink-0 flex items-center gap-1.5 px-2.5 sm:px-3 py-1 sm:py-1.5 rounded-full bg-emerald-950/60 border border-emerald-500/30 text-emerald-400 text-[11px] sm:text-xs font-semibold shadow-inner">
          <span class="relative flex h-2 w-2">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
          </span>
          <span id="live-text">Reaalajas</span>
        </div>
      </header>

      <!-- Liinifiltri vahelehed -->
      <nav class="mt-4 flex items-center gap-1.5 p-1 bg-slate-900/70 rounded-xl border border-slate-800/80 text-xs font-semibold">
        <button id="filter-all" onclick="setLineFilter('all')" class="flex-1 py-1.5 px-3 rounded-lg transition text-white bg-slate-800 shadow font-semibold">
          Liinid 8 / 8A
        </button>
        <button id="filter-8" onclick="setLineFilter('8')" class="flex-1 py-1.5 px-3 rounded-lg transition text-slate-400 hover:text-slate-200 font-semibold">
          Liin 8
        </button>
        <button id="filter-8a" onclick="setLineFilter('8A')" class="flex-1 py-1.5 px-3 rounded-lg transition text-slate-400 hover:text-slate-200 font-semibold">
          Liin 8A
        </button>
      </nav>

      <!-- Väljumiste sektsioon -->
      <section id="departures-container" class="mt-5 space-y-3.5">
        <div id="cards-wrapper" class="space-y-3.5">
          <!-- Esialgne laadimisolek (skelett) -->
          <div class="animate-pulse space-y-3.5">
            <div class="h-28 bg-slate-800/50 rounded-2xl"></div>
            <div class="h-20 bg-slate-800/30 rounded-2xl"></div>
          </div>
        </div>

        <!-- Teade, kui väljumisi pole või tekkis viga -->
        <div id="empty-state" class="hidden py-8 px-4 text-center glass-subcard rounded-2xl border border-slate-800">
          <div class="w-12 h-12 mx-auto mb-3 rounded-full bg-slate-800/80 flex items-center justify-center text-slate-400">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          </div>
          <p id="empty-message" class="text-sm text-slate-300 font-medium">Praegu väljumisi ei leitud.</p>
          <p id="empty-submessage" class="text-xs text-slate-500 mt-1">Bussiliin võib olla puhkeajal või andmed uuenevad.</p>
        </div>
      </section>

      <!-- Jalus: Uuendamise info ja nupud -->
      <footer class="mt-6 pt-5 border-t border-slate-800/80 flex flex-wrap items-center justify-between gap-3 text-xs text-slate-400">
        <div class="flex items-center gap-2">
          <button id="refresh-btn" onclick="manualRefresh()" title="Värskenda kohe" class="p-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white transition active:scale-95 flex items-center gap-1.5 focus:outline-none focus:ring-2 focus:ring-emerald-500/40">
            <svg id="refresh-icon" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
            <span class="hidden sm:inline">Värskenda</span>
          </button>
          <span>Uuendatud: <span id="last-updated" class="font-mono text-slate-300 font-semibold">--:--:--</span></span>
        </div>

        <div class="flex items-center gap-3">
          <span id="countdown-badge" class="font-mono text-[11px] px-2 py-0.5 rounded bg-slate-800 text-slate-400">
            15s
          </span>
          <div class="inline-flex items-center gap-1.5 text-slate-400">
            <span>Plaan:</span>
            <a href="https://transport.tallinn.ee/#bus/8/b-a/19001-1" target="_blank" rel="noopener noreferrer" class="hover:text-emerald-400 font-semibold underline underline-offset-4 decoration-slate-700 hover:decoration-emerald-400 transition">8</a>
            <span class="text-slate-600">·</span>
            <a href="https://transport.tallinn.ee/#bus/8a/b-a/19001-1" target="_blank" rel="noopener noreferrer" class="hover:text-sky-400 font-semibold underline underline-offset-4 decoration-slate-700 hover:decoration-sky-400 transition">8A</a>
          </div>
        </div>
      </footer>

    </div>

  </main>

  <!-- Staatiline brauseri JavaScript (otsepäring transport.tallinn.ee SIRI andmevoost) -->
  <script>
    const STOP_ID = '1579'; // Oblika tee (kood: 19001-1 / SIRI id: 1579)
    const ALLOWED_BUSES = ['8', '8A'];
    const BUS_DEFAULTS = {
      '8': { destination: 'Väike-Õismäe', route: 'Äigrumäe - Väike-Õismäe' },
      '8A': { destination: 'Viru keskus', route: 'Äigrumäe - Viru keskus' }
    };
    const SIRI_URL = `https://transport.tallinn.ee/siri-stop-departures.php?stopid=${STOP_ID}`;
    const UPDATE_INTERVAL = 15; // sekundit

    let secondsUntilRefresh = UPDATE_INTERVAL;
    let refreshTimer = null;
    let countdownTimer = null;
    let isFetching = false;
    let activeFilter = 'all'; // 'all', '8', '8A'
    let lastFetchedDepartures = [];
    let lastUpdatedTime = '--:--:--';

    function getLineBadge(line) {
      if (line === '8A') {
        return `<span class="inline-flex items-center justify-center px-2.5 py-0.5 rounded-lg bg-sky-500 text-slate-950 font-black text-sm tracking-tight shadow-sm">8A</span>`;
      }
      return `<span class="inline-flex items-center justify-center px-2.5 py-0.5 rounded-lg bg-[#00e0b3] text-slate-950 font-black text-sm tracking-tight shadow-sm">8</span>`;
    }

    function setLineFilter(filter) {
      activeFilter = filter;
      
      const btnAll = document.getElementById('filter-all');
      const btn8 = document.getElementById('filter-8');
      const btn8A = document.getElementById('filter-8a');
      const destEl = document.getElementById('route-destination');

      const activeClasses = ['text-white', 'bg-slate-800', 'shadow', 'font-semibold'];
      const inactiveClasses = ['text-slate-400', 'hover:text-slate-200'];

      [btnAll, btn8, btn8A].forEach(btn => {
        btn.classList.remove(...activeClasses);
        btn.classList.add(...inactiveClasses);
      });

      if (filter === '8') {
        btn8.classList.add(...activeClasses);
        btn8.classList.remove(...inactiveClasses);
        destEl.textContent = 'Väike-Õismäe';
      } else if (filter === '8A') {
        btn8A.classList.add(...activeClasses);
        btn8A.classList.remove(...inactiveClasses);
        destEl.textContent = 'Viru keskus';
      } else {
        btnAll.classList.add(...activeClasses);
        btnAll.classList.remove(...inactiveClasses);
        destEl.textContent = 'Väike-Õismäe / Viru keskus';
      }

      renderUI(lastFetchedDepartures);
    }

    // Teisendab sekundid alates südaööst formaati HH:MM
    function formatSecondsToTime(secondsFromMidnight) {
      const hours = Math.floor(secondsFromMidnight / 3600) % 24;
      const minutes = Math.floor((secondsFromMidnight % 3600) / 60);
      return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
    }

    // Kasutajasõbralik järelejäänud aja tekst
    function getRemainingText(remainingSeconds) {
      if (remainingSeconds < 60) {
        return 'Nüüd';
      }
      const minutes = Math.round(remainingSeconds / 60);
      return `${minutes} min`;
    }

    // Pärib ja parsib SIRI CSV andmed otse transport.tallinn.ee-st
    async function fetchDepartures() {
      if (isFetching) return;
      isFetching = true;

      const refreshIcon = document.getElementById('refresh-icon');
      refreshIcon.classList.add('animate-spin');

      try {
        const response = await fetch(SIRI_URL, { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        
        const text = await response.text();
        const lines = text.split('\n').map(l => l.trim()).filter(Boolean);

        const departures = [];

        for (let i = 1; i < lines.length; i++) {
          const parts = lines[i].split(',');
          // Formaat: Transport, RouteNum, ExpectedTimeInSeconds, ScheduleTimeInSeconds, Destination, RemainingSeconds, Flags
          if (parts.length >= 6) {
            const transportType = parts[0].trim().toLowerCase();
            const routeNum = parts[1].trim().toUpperCase();

            if (transportType === 'bus' && ALLOWED_BUSES.includes(routeNum)) {
              const expectedSec = parseInt(parts[2], 10);
              const schedSec = parseInt(parts[3], 10);
              const defaultDest = BUS_DEFAULTS[routeNum]?.destination || 'Tallinn';
              const destination = (parts[4] && parts[4].trim()) || defaultDest;
              const remainingSec = parseInt(parts[5], 10);
              const flags = parts[6] ? parts[6].trim() : '';

              const isRealtime = flags.includes('Z') || expectedSec !== schedSec;
              const delaySeconds = expectedSec - schedSec;
              const delayMinutes = Math.round(delaySeconds / 60);

              const timeStr = formatSecondsToTime(expectedSec);
              const schedTimeStr = formatSecondsToTime(schedSec);
              const remainingMins = Math.max(0, Math.round(remainingSec / 60));
              const remainingText = getRemainingText(remainingSec);

              let delayText = 'Graafikus';
              if (delayMinutes > 0) delayText = `+${delayMinutes} min`;
              else if (delayMinutes < 0) delayText = `${delayMinutes} min`;

              departures.push({
                line: routeNum,
                time: timeStr,
                scheduledTime: schedTimeStr,
                destination: destination,
                remainingSeconds: Math.max(0, remainingSec),
                remainingMinutes: remainingMins,
                remainingText: remainingText,
                isRealtime: isRealtime,
                delayMinutes: delayMinutes,
                delayText: delayText
              });
            }
          }
        }

        // Sorteeri kronoloogiliselt
        departures.sort((a, b) => a.remainingSeconds - b.remainingSeconds);

        const now = new Date();
        lastUpdatedTime = now.toTimeString().split(' ')[0];
        lastFetchedDepartures = departures;

        renderUI(departures);

      } catch (err) {
        console.error('Viga andmete pärimisel:', err);
        renderError('Andmeühenduse tõrge transport.tallinn.ee serveriga.');
      } finally {
        isFetching = false;
        refreshIcon.classList.remove('animate-spin');
        secondsUntilRefresh = UPDATE_INTERVAL;
      }
    }

    function renderUI(allDepartures) {
      const wrapper = document.getElementById('cards-wrapper');
      const emptyState = document.getElementById('empty-state');
      const emptyMessage = document.getElementById('empty-message');
      const emptySubmessage = document.getElementById('empty-submessage');
      const lastUpdatedEl = document.getElementById('last-updated');
      const liveIndicator = document.getElementById('live-indicator');
      const liveText = document.getElementById('live-text');

      lastUpdatedEl.textContent = lastUpdatedTime;

      // Filtreeri vastavalt aktiivsele režiimile
      let departures = allDepartures;
      if (activeFilter !== 'all') {
        departures = allDepartures.filter(dep => dep.line === activeFilter);
      }

      if (departures.length === 0) {
        wrapper.innerHTML = '';
        emptyState.classList.remove('hidden');
        
        if (activeFilter === '8A') {
          emptyMessage.textContent = 'Liinil 8A hetkel väljumisi ei ole.';
          emptySubmessage.textContent = 'Buss 8A sõidab peamiselt tööpäeviti tipptundidel (Äigrumäe → Viru keskus).';
        } else if (activeFilter === '8') {
          emptyMessage.textContent = 'Liinil 8 hetkel väljumisi ei leitud.';
          emptySubmessage.textContent = 'Bussiliin võib olla öisel puhkeajal või andmed uuenevad.';
        } else {
          emptyMessage.textContent = 'Praegu väljumisi ei leitud.';
          emptySubmessage.textContent = 'Bussiliinid võivad olla puhkeajal või andmed uuenevad.';
        }

        liveIndicator.className = 'flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-slate-800 border border-slate-700 text-slate-400 text-xs font-semibold shadow-inner';
        liveText.textContent = 'Ootel';
        return;
      }

      // Reaalajas indikaator aktiivseks
      liveIndicator.className = 'flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-emerald-950/60 border border-emerald-500/30 text-emerald-400 text-xs font-semibold shadow-inner';
      liveText.textContent = 'Reaalajas';
      emptyState.classList.add('hidden');

      let html = '';

      departures.slice(0, 4).forEach((dep, index) => {
        const isFirst = index === 0;
        const isImminent = dep.remainingMinutes <= 2;
        const delayBadge = dep.delayMinutes !== 0 
          ? `<span class="text-xs px-2 py-0.5 rounded-full ${dep.delayMinutes > 0 ? 'bg-amber-950/60 text-amber-300 border border-amber-500/30' : 'bg-blue-950/60 text-blue-300 border border-blue-500/30'}">${dep.delayText}</span>`
          : `<span class="text-xs px-2 py-0.5 rounded-full bg-slate-800 text-slate-400 border border-slate-700">Graafikus</span>`;

        const badgeHtml = getLineBadge(dep.line);

        if (isFirst) {
          // 1. kaart: Peamine / Järgmine buss
          html += `
            <div class="glass-subcard rounded-2xl p-5 border-emerald-500/30 bg-gradient-to-br from-slate-900/90 to-slate-850/80 shadow-lg relative overflow-hidden">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-2.5">
                  ${badgeHtml}
                  <div>
                    <div class="flex items-center gap-2">
                      <span class="text-[11px] font-bold uppercase tracking-wider text-emerald-400 bg-emerald-950/80 px-2 py-0.5 rounded-md border border-emerald-500/30">
                        Järgmine
                      </span>
                      ${delayBadge}
                    </div>
                    <span class="text-xs text-slate-400 mt-0.5 block font-medium">→ ${dep.destination}</span>
                  </div>
                </div>

                <!-- Minutite loendur -->
                <div class="text-right">
                  <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-xl ${isImminent ? 'bg-emerald-500 text-slate-950 font-bold animate-pulse' : 'bg-emerald-950/80 text-emerald-300 border border-emerald-500/40'} text-sm font-semibold shadow-md">
                    ${dep.remainingText}
                  </div>
                </div>
              </div>

              <!-- Suur kellaaeg -->
              <div class="mt-4 flex items-baseline justify-between pt-2 border-t border-slate-800/60">
                <div class="flex items-baseline gap-2">
                  <span class="font-mono text-4xl sm:text-5xl font-extrabold text-white tracking-tight">${dep.time}</span>
                  ${dep.scheduledTime !== dep.time ? `<span class="font-mono text-xs text-slate-500 line-through">plaanis ${dep.scheduledTime}</span>` : ''}
                </div>
                <span class="text-xs text-slate-400">väljumisaeg</span>
              </div>
            </div>
          `;
        } else {
          // Järgnevad väljumised
          html += `
            <div class="glass-subcard rounded-2xl p-3.5 border-slate-800 bg-slate-900/50 shadow transition-all hover:bg-slate-900/70">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                  ${badgeHtml}
                  <div>
                    <div class="flex items-baseline gap-2">
                      <span class="font-mono text-xl font-bold text-slate-100">${dep.time}</span>
                      <span class="text-xs text-slate-400 font-medium">(${dep.remainingText})</span>
                    </div>
                    <span class="text-[11px] text-slate-400">→ ${dep.destination}</span>
                  </div>
                </div>

                <div class="text-right">
                  ${delayBadge}
                </div>
              </div>
            </div>
          `;
        }
      });

      wrapper.innerHTML = html;
      wrapper.classList.add('fade-update');
      setTimeout(() => wrapper.classList.remove('fade-update'), 400);
    }

    function renderError(errorMsg) {
      const wrapper = document.getElementById('cards-wrapper');
      const emptyState = document.getElementById('empty-state');
      const emptyMessage = document.getElementById('empty-message');
      const emptySubmessage = document.getElementById('empty-submessage');
      const liveIndicator = document.getElementById('live-indicator');
      const liveText = document.getElementById('live-text');

      wrapper.innerHTML = '';
      emptyState.classList.remove('hidden');
      emptyMessage.textContent = errorMsg;
      emptySubmessage.textContent = 'Proovitakse automaatselt uuesti...';

      liveIndicator.className = 'flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-slate-800 border border-slate-700 text-slate-400 text-xs font-semibold shadow-inner';
      liveText.textContent = 'Võrguviga';
    }

    function manualRefresh() {
      fetchDepartures();
    }

    function startApp() {
      fetchDepartures();

      refreshTimer = setInterval(() => {
        fetchDepartures();
      }, UPDATE_INTERVAL * 1000);

      countdownTimer = setInterval(() => {
        if (secondsUntilRefresh > 0) {
          secondsUntilRefresh--;
        }
        const badge = document.getElementById('countdown-badge');
        if (badge) {
          badge.textContent = `${secondsUntilRefresh}s`;
        }
      }, 1000);
    }

    window.addEventListener('DOMContentLoaded', startApp);
  </script>
</body>
</html>
