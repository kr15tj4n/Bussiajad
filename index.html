  <style>
    /* Kohandatud taust ja klaas-efekt (Glassmorphism) */
    body {
      background-color: #020617;
      background-image: 
        radial-gradient(at 0% 0%, rgba(75, 133, 1, 0.18) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.14) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(30, 41, 59, 0.3) 0px, transparent 70%);
      background-attachment: fixed;
    }

    .glass-card {
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
    }

    .glass-subcard {
      background: rgba(30, 41, 59, 0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .fade-update {
      animation: flash-subtle 0.2s ease-out;
    }

    @keyframes flash-subtle {
      0% { opacity: 0.8; }
      100% { opacity: 1; }
    }

    /* Liikuma hakkamise liugurlüliti (Slider switch) */
    .walk-switch-track {
      transition: background-color 0.2s ease;
    }
    .walk-switch-thumb {
      transition: transform 0.2s ease;
    }
    input:checked ~ .walk-switch-track {
      background-color: #f97316;
    }
    input:checked ~ .walk-switch-thumb {
      transform: translateX(12px);
    }

    /* Päise sihtkoha sujuv paremalt-vasakule skroll (marquee) */
    @keyframes marquee-calm {
      0% {
        transform: translate3d(0, 0, 0);
      }
      100% {
        transform: translate3d(-50%, 0, 0);
      }
    }

    .animate-marquee {
      display: inline-flex;
      width: max-content;
      animation: marquee-calm 12s linear infinite;
      will-change: transform;
    }

    @media (hover: hover) {
      #route-dest-container:hover #route-dest-track {
        animation-play-state: paused;
      }
    }

    #route-dest-container:focus-within #route-dest-track {
      animation-play-state: paused;
    }

    .marquee-mask {
      mask-image: linear-gradient(to right, transparent 0, black 6px, black calc(100% - 12px), transparent 100%);
      -webkit-mask-image: linear-gradient(to right, transparent 0, black 6px, black calc(100% - 12px), transparent 100%);
    }

    @media (prefers-reduced-motion: reduce) {
      .animate-marquee {
        animation: none !important;
      }
    }
  </style>

<body class="min-h-screen text-slate-100 flex flex-col justify-between antialiased selection:bg-emerald-500 selection:text-white p-4 sm:p-6 md:p-8">

  <!-- Staatiline brauseri JavaScript (otsepäring transport.tallinn.ee SIRI andmevoost) -->
  <script>
    const ALLOWED_BUSES = ['8', '8A'];
    const UPDATE_INTERVAL = 15; // sekundit

    const DIRECTIONS = {
      pirita: {
        name: 'Pirita',
        stopId: '1579', // Oblika tee suunaga Pirita / linn (kood: 19001-1)
        stopCode: '19001-1',
        origin: {
          all: 'Äigrumäe',
          '8': 'Äigrumäe',
          '8A': 'Äigrumäe'
        },
        destination: {
          all: 'Väike-Õismäe / Viru keskus',
          '8': 'Väike-Õismäe',
          '8A': 'Viru keskus'
        },
        busDefaults: {
          '8': { destination: 'Väike-Õismäe' },
          '8A': { destination: 'Viru keskus' }
        },
        busMaps: {
          '8': 'https://transport.tallinn.ee/#bus/8/b-a/19001-1/map',
          '8A': 'https://transport.tallinn.ee/#bus/8a/b-a/19001-1/map'
        },
        busSchedules: {
          '8': 'https://transport.tallinn.ee/#bus/8/b-a/19001-1',
          '8A': 'https://transport.tallinn.ee/#bus/8a/b-a/19001-1'
        }
      },
      aigrumae: {
        name: 'Äigrumäe',
        stopId: '1580', // Oblika tee suunaga Äigrumäe (kood: 19002-1)
        stopCode: '19002-1',
        origin: {
          all: 'Väike-Õismäe / Viru keskus',
          '8': 'Väike-Õismäe',
          '8A': 'Viru keskus'
        },
        destination: {
          all: 'Äigrumäe',
          '8': 'Äigrumäe',
          '8A': 'Äigrumäe'
        },
        busDefaults: {
          '8': { destination: 'Äigrumäe' },
          '8A': { destination: 'Äigrumäe' }
        },
        busMaps: {
          '8': 'https://transport.tallinn.ee/#bus/8/a-b/19002-1/map',
          '8A': 'https://transport.tallinn.ee/#bus/8a/a-b/19002-1/map'
        },
        busSchedules: {
          '8': 'https://transport.tallinn.ee/#bus/8/a-b/19002-1',
          '8A': 'https://transport.tallinn.ee/#bus/8a/a-b/19002-1'
        }
      }
    };

    let activeDirection = 'pirita'; // 'pirita' või 'aigrumae'
    let activeFilter = 'all'; // 'all', '8', '8A'
    let activeFetchController = null;
    let secondsUntilRefresh = UPDATE_INTERVAL;
    let refreshTimer = null;
    let countdownTimer = null;
    let isFetching = false;
    let isWalkEnabled = false;
    let lastFetchedDepartures = [];
    let lastUpdatedTime = '--:--:--';
    let lastFetchTimestamp = 0;

    // Turvaline HTML teksti kodeerimine (XSS kaitse)
    function escapeHtml(str) {
      if (str === null || str === undefined || str === '') return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function getLineBadge(line) {
      if (line === '8A') {
        return `<span class="inline-flex items-center justify-center px-2.5 py-0.5 rounded-lg bg-sky-500 text-slate-950 font-black text-sm tracking-tight shadow-sm">8A</span>`;
      }
      return `<span class="inline-flex items-center justify-center px-2.5 py-0.5 rounded-lg bg-[#00e0b3] text-slate-950 font-black text-sm tracking-tight shadow-sm">8</span>`;
    }

    function updateRouteHeader() {
      const destEl = document.getElementById('route-destination');
      if (!destEl) return;

      const dirConfig = DIRECTIONS[activeDirection] || DIRECTIONS.pirita;
      const destText = dirConfig.destination[activeFilter] || dirConfig.destination.all;

      destEl.textContent = destText;
      destEl.setAttribute('title', destText);

      updateDestinationMarquee();
    }

    function toggleDirectionDropdown(force) {
      const menu = document.getElementById('direction-menu');
      const btn = document.getElementById('direction-btn');
      const chevron = document.getElementById('direction-chevron');
      if (!menu || !btn) return;

      const isHidden = menu.classList.contains('hidden');
      const shouldOpen = force !== undefined ? force : isHidden;

      if (shouldOpen) {
        menu.classList.remove('hidden');
        btn.setAttribute('aria-expanded', 'true');
        if (chevron) chevron.classList.add('rotate-180');
      } else {
        menu.classList.add('hidden');
        btn.setAttribute('aria-expanded', 'false');
        if (chevron) chevron.classList.remove('rotate-180');
      }
    }

    function closeDirectionDropdown() {
      toggleDirectionDropdown(false);
    }

    function selectDirection(dir) {
      closeDirectionDropdown();
      setDirection(dir);
      const btn = document.getElementById('direction-btn');
      if (btn) btn.focus();
    }

    function updateFooterSchedules() {
      const dirConfig = DIRECTIONS[activeDirection] || DIRECTIONS.pirita;
      const link8 = document.getElementById('schedule-link-8');
      const link8A = document.getElementById('schedule-link-8a');
      if (link8) link8.href = dirConfig.busSchedules['8'];
      if (link8A) link8A.href = dirConfig.busSchedules['8A'];
    }

    function setDirection(dir, updateHistory = true) {
      if (dir !== 'pirita' && dir !== 'aigrumae') {
        dir = 'pirita';
      }
      activeDirection = dir;

      // Uuenda kohandatud rippmenüü nuppu ja valikute olekut
      const btnText = document.getElementById('direction-btn-text');
      if (btnText) {
        btnText.textContent = DIRECTIONS[dir].name;
      }

      const optPirita = document.getElementById('dir-opt-pirita');
      const optAigrumae = document.getElementById('dir-opt-aigrumae');
      const checkPirita = document.getElementById('dir-check-pirita');
      const checkAigrumae = document.getElementById('dir-check-aigrumae');

      const activeClasses = ['bg-emerald-500/15', 'text-emerald-400', 'font-bold', 'border-emerald-500/20'];
      const inactiveClasses = ['text-slate-300', 'hover:text-white', 'hover:bg-slate-800/80', 'border-transparent'];

      if (dir === 'pirita') {
        if (optPirita) {
          optPirita.classList.remove(...inactiveClasses);
          optPirita.classList.add(...activeClasses);
          optPirita.setAttribute('aria-selected', 'true');
        }
        if (checkPirita) checkPirita.classList.remove('hidden');

        if (optAigrumae) {
          optAigrumae.classList.remove(...activeClasses);
          optAigrumae.classList.add(...inactiveClasses);
          optAigrumae.setAttribute('aria-selected', 'false');
        }
        if (checkAigrumae) checkAigrumae.classList.add('hidden');
      } else {
        if (optAigrumae) {
          optAigrumae.classList.remove(...inactiveClasses);
          optAigrumae.classList.add(...activeClasses);
          optAigrumae.setAttribute('aria-selected', 'true');
        }
        if (checkAigrumae) checkAigrumae.classList.remove('hidden');

        if (optPirita) {
          optPirita.classList.remove(...activeClasses);
          optPirita.classList.add(...inactiveClasses);
          optPirita.setAttribute('aria-selected', 'false');
        }
        if (checkPirita) checkPirita.classList.add('hidden');
      }

      if (activeFetchController) {
        activeFetchController.abort();
        activeFetchController = null;
      }
      isFetching = false;

      try {
        localStorage.setItem('bussiajad_direction', dir);
      } catch (e) {
        console.warn('LocalStorage viga:', e);
      }

      if (updateHistory) {
        const url = new URL(window.location.href);
        url.searchParams.delete('direction');
        if (dir === 'pirita') {
          url.searchParams.delete('dir');
        } else {
          url.searchParams.set('dir', dir);
        }
        window.history.replaceState(null, '', url.toString());
      }

      updateRouteHeader();
      updateFooterSchedules();

      // Kuva laadimisskelett uue suuna laadimisel
      const wrapper = document.getElementById('cards-wrapper');
      const emptyState = document.getElementById('empty-state');
      if (emptyState) emptyState.classList.add('hidden');
      if (wrapper) {
        wrapper.innerHTML = `
          <div class="animate-pulse space-y-3.5">
            <div class="h-28 bg-slate-800/50 rounded-2xl"></div>
            <div class="h-20 bg-slate-800/30 rounded-2xl"></div>
          </div>
        `;
      }

      lastFetchedDepartures = [];
      fetchDepartures();
      resetRefreshCycle();
      startCountdown();
    }

    // Päise sihtkoha skrollimise loogika (kui sihtkoht pärast ">" märki ei mahu ära, skrolli rahulikult paremalt vasakule)
    function updateDestinationMarquee() {
      const container = document.getElementById('route-dest-container');
      const track = document.getElementById('route-dest-track');
      const destEl = document.getElementById('route-destination');
      if (!container || !track || !destEl) return;

      // 1. Eemalda ajutiselt animatsioon ja duplikaat täpseks mõõtmiseks
      track.classList.remove('animate-marquee');
      track.style.animationDuration = '';
      container.classList.remove('marquee-mask');
      destEl.classList.remove('pr-8');

      const existingDup = track.querySelector('.marquee-dup');
      if (existingDup) {
        existingDup.remove();
      }

      // 2. Mõõda tegelikud mõõtmed
      const textWidth = Math.ceil(destEl.getBoundingClientRect().width);
      const containerWidth = Math.floor(container.getBoundingClientRect().width);
      const currentText = destEl.textContent.trim();
      container.setAttribute('title', currentText);

      // 3. Kui ei mahu konteinerisse ära (vähemalt 2px varu ümarduste jaoks)
      if (containerWidth > 0 && textWidth > containerWidth + 2) {
        destEl.classList.add('pr-8');

        // Duplikaat sujuvaks ja katkematu paremalt-vasakule korduseks
        const dup = document.createElement('span');
        dup.className = 'marquee-dup text-slate-300 font-semibold pr-8 whitespace-nowrap inline-block';
        dup.setAttribute('aria-hidden', 'true');
        dup.textContent = currentText;
        track.appendChild(dup);

        // Rahulik ja stabiilne liikumiskiirus (~20px sekundis)
        const singleItemWidth = destEl.getBoundingClientRect().width;
        const duration = Math.max(8, Math.round(singleItemWidth / 20));
        track.style.animationDuration = `${duration}s`;

        container.classList.add('marquee-mask');
        track.classList.add('animate-marquee');
      }
    }

    function setLineFilter(filter, updateHistory = true) {
      activeFilter = filter;
      
      const btnAll = document.getElementById('filter-all');
      const btn8 = document.getElementById('filter-8');
      const btn8A = document.getElementById('filter-8a');

      if (btnAll) btnAll.setAttribute('aria-selected', filter === 'all' ? 'true' : 'false');
      if (btn8) btn8.setAttribute('aria-selected', filter === '8' ? 'true' : 'false');
      if (btn8A) btn8A.setAttribute('aria-selected', filter === '8A' ? 'true' : 'false');

      if (updateHistory) {
        const url = new URL(window.location.href);
        if (filter === 'all') {
          url.searchParams.delete('filter');
        } else {
          url.searchParams.set('filter', filter);
        }
        window.history.replaceState(null, '', url.toString());
      }

      const baseInactive = ['text-slate-300', 'hover:text-white', 'hover:bg-slate-800/50', 'border-transparent'];
      const activeAllClasses = ['text-white', 'bg-slate-800', 'border-slate-600/80', 'shadow-md', 'font-bold'];
      const active8Classes = ['text-[#00e0b3]', 'bg-[#00e0b3]/15', 'border-[#00e0b3]/50', 'shadow-md', 'shadow-[#00e0b3]/10', 'font-bold'];
      const active8AClasses = ['text-sky-300', 'bg-sky-500/15', 'border-sky-500/50', 'shadow-md', 'shadow-sky-500/10', 'font-bold'];

      const allDynamicClasses = [...baseInactive, ...activeAllClasses, ...active8Classes, ...active8AClasses];

      [btnAll, btn8, btn8A].forEach(btn => {
        if (!btn) return;
        btn.classList.remove(...allDynamicClasses);
        btn.classList.add(...baseInactive);
      });

      if (filter === '8') {
        btn8.classList.remove(...baseInactive);
        btn8.classList.add(...active8Classes);
      } else if (filter === '8A') {
        btn8A.classList.remove(...baseInactive);
        btn8A.classList.add(...active8AClasses);
      } else {
        btnAll.classList.remove(...baseInactive);
        btnAll.classList.add(...activeAllClasses);
      }

      updateRouteHeader();
      if (lastFetchTimestamp > 0 || lastFetchedDepartures.length > 0) {
        renderUI(lastFetchedDepartures);
      }
    }

    // Teisendab sekundid alates südaööst formaati HH:MM (toetab normaliseeritult ka südaöö ületust)
    function formatSecondsToTime(secondsFromMidnight) {
      if (isNaN(secondsFromMidnight)) return '--:--';
      const normalized = ((Math.floor(secondsFromMidnight) % 86400) + 86400) % 86400;
      const hours = Math.floor(normalized / 3600);
      const minutes = Math.floor((normalized % 3600) / 60);
      return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
    }

    // Normaliseerib graafikuhälbe südaöö ületusel (-12h kuni +12h vahemikku)
    function normalizeDelaySeconds(delaySec) {
      if (delaySec < -43200) return delaySec + 86400;
      if (delaySec > 43200) return delaySec - 86400;
      return delaySec;
    }

    // Kasutajasõbralik järelejäänud aja tekst
    function getRemainingText(remainingSeconds) {
      if (remainingSeconds < 60) {
        return 'Nüüd';
      }
      const minutes = Math.round(remainingSeconds / 60);
      return `${minutes} min`;
    }

    // Pärib ja parsib SIRI CSV andmed otse transport.tallinn.ee-st (koos AbortControlleriga)
    async function fetchDepartures() {
      if (isFetching) return;
      isFetching = true;

      const currentDirection = activeDirection;
      const controller = new AbortController();
      activeFetchController = controller;
      const timeoutId = setTimeout(() => controller.abort(), 8000); // 8s timeout

      const refreshIcon = document.getElementById('refresh-icon');
      if (refreshIcon) refreshIcon.classList.add('animate-spin');

      const dirConfig = DIRECTIONS[activeDirection] || DIRECTIONS.pirita;
      const siriUrl = `https://transport.tallinn.ee/siri-stop-departures.php?stopid=${dirConfig.stopId}`;

      try {
        const response = await fetch(siriUrl, { 
          cache: 'no-store',
          signal: controller.signal 
        });
        clearTimeout(timeoutId);

        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        
        const text = await response.text();

        // Kui suunda vahetati aktiivse päringu ajal, ignoreeri aegunud vastust
        if (currentDirection !== activeDirection) {
          return;
        }

        const lines = text.split('\n').map(l => l.trim()).filter(Boolean);

        const departures = [];

        for (let i = 1; i < lines.length; i++) {
          const parts = lines[i].split(',');
          // Formaat: Transport, RouteNum, ExpectedTimeInSeconds, ScheduleTimeInSeconds, Destination, RemainingSeconds, Flags
          if (parts.length >= 6) {
            const transportType = parts[0].trim().toLowerCase();
            const routeNum = parts[1].trim().toUpperCase();

            if (transportType === 'bus' && ALLOWED_BUSES.includes(routeNum)) {
              const expectedSec = parseInt(parts[2], 10);
              const schedSec = parseInt(parts[3], 10);
              const defaultDest = dirConfig.busDefaults[routeNum]?.destination || 'Tallinn';
              const rawDest = parts[4] ? parts[4].trim() : '';
              const destination = escapeHtml(rawDest || defaultDest);
              const remainingSec = parseInt(parts[5], 10);
              const flags = parts[6] ? parts[6].trim() : '';

              if (isNaN(expectedSec) || isNaN(schedSec) || isNaN(remainingSec)) {
                continue;
              }

              // Ära kuva busse, mis on rohkem kui 30 sekundit tagasi peatusest lahkunud
              if (remainingSec < -30) {
                continue;
              }

              const isRealtime = flags.includes('Z') || expectedSec !== schedSec;
              const delaySeconds = normalizeDelaySeconds(expectedSec - schedSec);
              const delayMinutes = Math.round(delaySeconds / 60);

              const timeStr = formatSecondsToTime(expectedSec);
              const schedTimeStr = formatSecondsToTime(schedSec);
              const remainingMins = Math.max(0, Math.round(remainingSec / 60));
              const remainingText = getRemainingText(remainingSec);

              let delayText = 'Graafikus';
              if (delayMinutes > 0) delayText = `+${delayMinutes} min`;
              else if (delayMinutes < 0) delayText = `${delayMinutes} min`;

              departures.push({
                line: routeNum,
                time: timeStr,
                scheduledTime: schedTimeStr,
                destination: destination,
                remainingSeconds: Math.max(0, remainingSec),
                remainingMinutes: remainingMins,
                remainingText: remainingText,
                isRealtime: isRealtime,
                delayMinutes: delayMinutes,
                delayText: delayText,
                expectedSec: expectedSec
              });
            }
          }
        }

        // Sorteeri kronoloogiliselt
        departures.sort((a, b) => a.remainingSeconds - b.remainingSeconds);

        const now = new Date();
        lastFetchTimestamp = Date.now();
        lastUpdatedTime = now.toTimeString().split(' ')[0];
        lastFetchedDepartures = departures;

        renderUI(departures);

      } catch (err) {
        clearTimeout(timeoutId);
        // Kui päring tühistati suunavahetuse tõttu, ignoreeri ja ära kuva veateadet
        if (err.name === 'AbortError' && currentDirection !== activeDirection) {
          return;
        }
        console.error('Viga andmete pärimisel:', err);
        const errorMsg = err.name === 'AbortError'
          ? 'Päring aegus (server ei vasta).'
          : (!navigator.onLine ? 'Internetiühendus puudub (offline).' : 'Andmeühenduse tõrge transport.tallinn.ee serveriga.');
        renderError(errorMsg);
      } finally {
        if (activeFetchController === controller) {
          activeFetchController = null;
        }
        isFetching = false;
        if (refreshIcon) refreshIcon.classList.remove('animate-spin');
        secondsUntilRefresh = UPDATE_INTERVAL;
      }
    }

    function renderUI(allDepartures) {
      const wrapper = document.getElementById('cards-wrapper');
      const emptyState = document.getElementById('empty-state');
      const emptyMessage = document.getElementById('empty-message');
      const emptySubmessage = document.getElementById('empty-submessage');
      const lastUpdatedEl = document.getElementById('last-updated');

      if (lastUpdatedEl) lastUpdatedEl.textContent = lastUpdatedTime;

      // Filtreeri vastavalt aktiivsele režiimile
      let departures = allDepartures;
      if (activeFilter !== 'all') {
        departures = allDepartures.filter(dep => dep.line === activeFilter);
      }

      if (departures.length === 0) {
        wrapper.innerHTML = '';
        emptyState.classList.remove('hidden');
        
        if (activeFilter === '8A') {
          emptyMessage.textContent = 'Liinil 8A hetkel väljumisi ei ole.';
          emptySubmessage.textContent = activeDirection === 'aigrumae'
            ? 'Buss 8A sõidab peamiselt tööpäeviti tipptundidel (Viru keskus → Äigrumäe).'

      let html = '';

          ? `<span class="text-xs px-2 py-0.5 rounded-full ${dep.delayMinutes > 0 ? 'bg-amber-950/60 text-amber-300 border border-amber-500/30' : 'bg-blue-950/60 text-blue-300 border border-blue-500/30'}">${escapeHtml(dep.delayText)}</span>`
          : `<span class="text-xs px-2 py-0.5 rounded-full bg-slate-800 text-slate-400 border border-slate-700">Graafikus</span>`;

        const badgeHtml = getLineBadge(dep.line);

          if (isWalkEnabled) {
            const elapsed = lastFetchTimestamp ? Math.floor((Date.now() - lastFetchTimestamp) / 1000) : 0;
            const currentRemainingSec = Math.max(0, dep.remainingSeconds - elapsed);

            if (currentRemainingSec < 240) {

                <div id="walk-time-indicator" data-waited="true" class="mt-1 flex items-center gap-1.5 text-xs text-rose-400 font-medium">
                  <svg class="w-3.5 h-3.5 flex-shrink-0 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                  </svg>
                  <span>Oota järgmist bussi</span>
                </div>
              `;
            } else {
              const walkSec = dep.expectedSec - 240;
              const walkTimeStr = formatSecondsToTime(walkSec);
              walkHtml = `
                <div id="walk-time-indicator" data-waited="false" class="mt-1 flex items-center gap-1.5 text-xs text-orange-400 font-medium">
                  <svg class="w-3.5 h-3.5 flex-shrink-0 text-orange-400" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M13.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM9.8 8.9L7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3C14.8 12 16.8 13 19 13v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6 8.3V13h2V9.6l1.8-.7"/>
                  </svg>
                  <span>Hakka liikuma ${escapeHtml(walkTimeStr)}</span>
                </div>
              `;
            }
          }

          // 1. kaart: Peamine / Järgmine buss
          html += `
            <div class="glass-subcard rounded-2xl p-5 border-emerald-500/30 bg-gradient-to-br from-slate-900/90 to-slate-850/80 shadow-lg relative overflow-hidden">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-2.5">
                  ${badgeHtml}
                  <div>
                    <div class="flex items-center gap-2">
                      <span class="text-[11px] font-bold uppercase tracking-wider text-emerald-400 bg-emerald-950/80 px-2 py-0.5 rounded-md border border-emerald-500/30">

                  <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-xl ${isImminent ? 'bg-emerald-500 text-slate-950 font-bold animate-pulse' : 'bg-emerald-950/80 text-emerald-300 border border-emerald-500/40'} text-sm font-semibold shadow-md">
                    ${escapeHtml(dep.remainingText)}
                  </div>
                </div>
              </div>

              <!-- Suur kellaaeg & Kaart nupp -->

          html += `

      wrapper.classList.add('fade-update');
      setTimeout(() => wrapper.classList.remove('fade-update'), 400);
    }

    function renderError(errorMsg) {
      const wrapper = document.getElementById('cards-wrapper');
      const emptyState = document.getElementById('empty-state');
      const emptyMessage = document.getElementById('empty-message');
      const emptySubmessage = document.getElementById('empty-submessage');
      const lastUpdatedEl = document.getElementById('last-updated');

      // Kui meil on juba väljumised ekraanil, säilitame need ja näitame hoiatust
      if (lastFetchedDepartures && lastFetchedDepartures.length > 0) {
        if (lastUpdatedEl) {
          lastUpdatedEl.innerHTML = `<span class="text-amber-400 font-semibold" title="${escapeHtml(errorMsg)}">${lastUpdatedTime} ⚠️</span>`;
        }
        return;
      }

      // Kui andmeid pole veel kordagi laaditud, kuvame puhta veaoleku
      wrapper.innerHTML = '';
      emptyState.classList.remove('hidden');
      emptyMessage.textContent = errorMsg;
      emptySubmessage.textContent = 'Proovitakse automaatselt uuesti...';
    }

    function resetRefreshCycle() {
      clearInterval(refreshTimer);
      secondsUntilRefresh = UPDATE_INTERVAL;
      const badge = document.getElementById('countdown-badge');
      if (badge) badge.textContent = `${secondsUntilRefresh}s`;

      refreshTimer = setInterval(() => {
        fetchDepartures();
      }, UPDATE_INTERVAL * 1000);
    }

    function manualRefresh() {
      fetchDepartures();
      resetRefreshCycle();
      startCountdown();
    }

    function toggleWalkTime(enabled) {
      isWalkEnabled = !!enabled;
      try {
        localStorage.setItem('bussiajad_walk_enabled', isWalkEnabled ? 'true' : 'false');
      } catch (e) {
        console.warn('LocalStorage viga:', e);
      }
      updateWalkToggleUI();
      renderUI(lastFetchedDepartures);
    }

    function updateWalkToggleUI() {
      const toggle = document.getElementById('walk-toggle');
      const icon = document.getElementById('walk-icon');

      if (toggle && toggle.checked !== isWalkEnabled) {
        toggle.checked = isWalkEnabled;
      }

      if (icon) {
        if (isWalkEnabled) {
          icon.classList.remove('text-slate-400');
          icon.classList.add('text-orange-400');
        } else {
          icon.classList.remove('text-orange-400');
          icon.classList.add('text-slate-400');
        }
      }
    }

    function startCountdown() {
      clearInterval(countdownTimer);
      countdownTimer = setInterval(() => {
        if (secondsUntilRefresh > 0) {
          secondsUntilRefresh--;
        }
        const badge = document.getElementById('countdown-badge');
        if (badge) {
          badge.textContent = `${secondsUntilRefresh}s`;
        }

        // Kui liikuma hakkamise slaider on sisse lülitatud, kontrolli kas vajab reaalajas üleminekut (kui alla 4 min)
        if (isWalkEnabled && lastFetchedDepartures && lastFetchedDepartures.length > 0) {
          const walkEl = document.getElementById('walk-time-indicator');
          if (walkEl && walkEl.dataset.waited === 'false') {
            let activeDeps = lastFetchedDepartures;
            if (activeFilter !== 'all') {
              activeDeps = lastFetchedDepartures.filter(dep => dep.line === activeFilter);
            }
            if (activeDeps.length > 0) {
              const firstDep = activeDeps[0];
              const elapsed = lastFetchTimestamp ? Math.floor((Date.now() - lastFetchTimestamp) / 1000) : 0;
              const currentRemainingSec = Math.max(0, firstDep.remainingSeconds - elapsed);
              if (currentRemainingSec < 240) {
                renderUI(lastFetchedDepartures);
              }
            }
          }
        }
      }, 1000);
    }

    function handleVisibilityChange() {
      if (document.hidden) {
        clearInterval(refreshTimer);
        clearInterval(countdownTimer);
      } else {
        const now = Date.now();
        if (now - lastFetchTimestamp >= UPDATE_INTERVAL * 1000) {
          fetchDepartures();
        }
        resetRefreshCycle();
        startCountdown();
      }
    }

    let deferredInstallPrompt = null;

    function initPWA() {
      // 1. Service Workeri registreerimine
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then((reg) => {
              console.log('PWA Service Worker registreeritud:', reg.scope);
            })
            .catch((err) => {
              console.warn('PWA Service Worker tõrge:', err);
            });
        });
      }

      // 2. PWA paigaldamise viiba kuulaja (Chrome / Android / Desktop)
      const installBtn = document.getElementById('pwa-install-btn');
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredInstallPrompt = e;
        if (installBtn) {
          installBtn.classList.remove('hidden');
          installBtn.classList.add('inline-flex');
        }
      });

      if (installBtn) {
        installBtn.addEventListener('click', async () => {
          if (!deferredInstallPrompt) return;
          deferredInstallPrompt.prompt();
          const choiceResult = await deferredInstallPrompt.userChoice;
          if (choiceResult.outcome === 'accepted') {
            console.log('Kasutaja paigaldas PWA');
          }
          deferredInstallPrompt = null;
          installBtn.classList.add('hidden');
          installBtn.classList.remove('inline-flex');
        });
      }

      window.addEventListener('appinstalled', () => {
        deferredInstallPrompt = null;
        if (installBtn) {
          installBtn.classList.add('hidden');
          installBtn.classList.remove('inline-flex');
        }
        console.log('PWA on edukalt paigaldatud!');
      });

      // 3. Võrguühenduse (Online/Offline) oleku jälgimine
      window.addEventListener('online', () => {
        fetchDepartures();
        resetRefreshCycle();
      });
    }

    function startApp() {
      // 1. Laadi liikuma hakkamise slaideri olek vahemälust
      try {
        isWalkEnabled = localStorage.getItem('bussiajad_walk_enabled') === 'true';
      } catch (e) {
        isWalkEnabled = false;
      }
      updateWalkToggleUI();

      // 2. Kontrolli URL parameetreid ja salvestatud eelistusi
      const urlParams = new URLSearchParams(window.location.search);

      // Suund: ?dir=aigrumae -> localStorage -> vaikimisi 'pirita'
      const dirParam = urlParams.get('dir') || urlParams.get('direction');
      let initialDirection = 'pirita';
      if (dirParam && (dirParam.toLowerCase() === 'aigrumae' || dirParam.toLowerCase() === 'äigrumäe')) {
        initialDirection = 'aigrumae';
      } else {
        try {
          const savedDir = localStorage.getItem('bussiajad_direction');
          if (savedDir === 'aigrumae') {
            initialDirection = 'aigrumae';
          }
        } catch (e) {
          console.warn('LocalStorage viga:', e);
        }
      }

      // Liinifilter: ?filter=8 või ?filter=8A
      const filterParam = urlParams.get('filter');
      if (filterParam) {
        const normalized = filterParam.toUpperCase();
        if (normalized === '8' || normalized === '8A') {
          activeFilter = normalized;
        }
      }

      // Rakenda algne suund ja liinifilter ilma brauseri ajalugu risustamata
      setDirection(initialDirection, false);
      if (activeFilter !== 'all') {
        setLineFilter(activeFilter, false);
      }

      // Jälgi sihtkoha konteineri laiust (akna suuruse muutus, ekraani pööramine jne)
      const destContainer = document.getElementById('route-dest-container');
      if (destContainer && window.ResizeObserver) {
        let lastWidth = 0;
        let resizeRaf = null;
        const resizeObserver = new ResizeObserver((entries) => {
          for (const entry of entries) {
            const width = Math.floor(entry.contentRect.width);
            if (width !== lastWidth) {
              lastWidth = width;
              if (resizeRaf) cancelAnimationFrame(resizeRaf);
              resizeRaf = requestAnimationFrame(() => {
                updateDestinationMarquee();
              });
            }
          }
        });
        resizeObserver.observe(destContainer);
      } else {
        window.addEventListener('resize', () => {
          updateDestinationMarquee();
        });
      }

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => {
          updateDestinationMarquee();
        });
      }

      initPWA();
      document.addEventListener('visibilitychange', handleVisibilityChange);

      // Sulge suuna rippmenüü väljapoole klikates
      document.addEventListener('click', (e) => {
        const container = document.getElementById('direction-dropdown-container');
        if (container && !container.contains(e.target)) {
          closeDirectionDropdown();
        }
      });

      // Sulge suuna rippmenüü Escape klahviga
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          closeDirectionDropdown();
          const btn = document.getElementById('direction-btn');
          if (btn) btn.focus();
        }
      });

      // Sulge suuna rippmenüü kui fookus liigub klaviatuuriga konteinerist välja
      const dirContainer = document.getElementById('direction-dropdown-container');
      if (dirContainer) {
        dirContainer.addEventListener('focusout', (e) => {
          if (!dirContainer.contains(e.relatedTarget)) {
            closeDirectionDropdown();
          }
        });
      }
    }

    window.addEventListener('DOMContentLoaded', startApp);
  </script>
</body>
</html>
